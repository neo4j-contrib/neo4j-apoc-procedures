name: CI

on:
  push:
    branches: [ "4.4" ]
  pull_request:
    branches: [ "4.4" ]

env:
  TEAMCITY_FOUR_FOUR_URL: ${{ secrets.TEAMCITY_FOUR_FOUR_URL }}
  TEAMCITY_USER: ${{ secrets.TEAMCITY_USER }}
  TEAMCITY_PASSWORD: ${{ secrets.TEAMCITY_PASSWORD }}


jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./.github/actions/setup-jdk
      - uses: ./.github/actions/setup-gradle-cache
      - name: Compile
        run: ./gradlew compileJava compileTestJava

  code-ql:
    runs-on: ubuntu-latest
    needs: compile

    # required by CodeQL
    permissions:
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./.github/actions/setup-jdk
      - uses: ./.github/actions/setup-gradle-cache
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8ff85221d12737ec1137e6a892722e5130f32d05 # v3.28.8
        with:
          languages: java
      - name: Compile
        run: ./gradlew compileJava compileTestJava
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8ff85221d12737ec1137e6a892722e5130f32d05 # v3.28.8

  format-checks:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./.github/actions/setup-jdk
      - uses: ./.github/actions/setup-gradle-cache
      - name: Check all the files are properly formatted
        run: ./gradlew spotlessCheck

  license-checks:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./.github/actions/setup-jdk
      - uses: ./.github/actions/setup-gradle-cache
      - name: Check LICENSE and NOTICE files
        run: ./gradlew validateLicenses generateLicensesFiles

  tests:
    strategy:
      fail-fast: false
      matrix:
        project: ['core', 'full', 'processor', 'test-utils', 'core-it', 'full-it']
    env:
      DOCKER_ENTERPRISE_FOUR_FOUR_URL: ${{ secrets.DOCKER_ENTERPRISE_FOUR_FOUR_URL }}
      DOCKER_COMMUNITY_FOUR_FOUR_URL: ${{ secrets.DOCKER_COMMUNITY_FOUR_FOUR_URL }}
      ENTERPRISE_TAR: enterprise-docker.tar
      COMMUNITY_TAR: community-docker.tar

    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Download neo4j 4.4 docker container
        if: matrix.project == 'core-it' ||  matrix.project == 'full-it' ||  matrix.project == 'core'
        run: |
          set -euo pipefail
          df -h /
          curl -fsSL --retry 3 --retry-delay 5 \
            -u "${TEAMCITY_USER}:${TEAMCITY_PASSWORD}" \
            -o "${ENTERPRISE_TAR}" "${DOCKER_ENTERPRISE_FOUR_FOUR_URL}"
          curl -fsSL --retry 3 --retry-delay 5 \
            -u "${TEAMCITY_USER}:${TEAMCITY_PASSWORD}" \
            -o "${COMMUNITY_TAR}" "${DOCKER_COMMUNITY_FOUR_FOUR_URL}"
          file "${ENTERPRISE_TAR}" "${COMMUNITY_TAR}"
          docker load --input "${ENTERPRISE_TAR}"
          docker load --input "${COMMUNITY_TAR}"
          rm -f "${ENTERPRISE_TAR}" "${COMMUNITY_TAR}"

      - name: Run ${{ matrix.project }} tests
        uses: ./.github/actions/test-gradle-project
        with:
          project-name: ${{ matrix.project }}